# Inbox configuration: ~/.inbox/config.toml. Keep personal configuration private.
[me]
name = "Your Name"

# Authenticate a connector using its own setup, then run:
#   inbox connector add gmail
#   inbox connector add whatsapp
#   inbox connector add telegram
# Inbox discovers accounts and adds connector.account channels automatically.
# For an account named "work", the generated mapping looks like:
# [connectors.gmail]
# command = "/path/to/gmail"
# alias = "email"              # optional pass-through alias: inbox email ...
# [channels."gmail.work"]
# connector = "gmail"
# account = "work"
# default = true
# address = "you@example.org"

# Configure these after registering the appropriate connector accounts.
# [reminders]
# via = "telegram.assistant"
# to = "telegram.assistant"    # or an address recognized by that connector
# compose = true
