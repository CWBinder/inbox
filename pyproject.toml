[project]
name = "pa-cli"
version = "0.1.0"
description = "Personal assistant CLI: mail and WhatsApp through standalone clients, reminders, policy and an audit log."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
pa = "pa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa"]
